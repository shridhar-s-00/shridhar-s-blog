<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title}}</title>
<meta name="description" content="{{description}}">
<meta name="author" content="{{author}}">
<meta property="og:title" content="{{page_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<link rel="stylesheet" href="{{root}}assets/css/theme.css?v={{v}}">
<link rel="stylesheet" href="{{root}}assets/css/code.css?v={{v}}">
<link rel="stylesheet" href="{{root}}assets/css/site.css?v={{v}}">
<script>
  // Applied before first paint so the page never flashes the wrong theme.
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) {}
  })();
</script>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <button class="icon-button" id="menu-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
  </button>
  <a class="topbar-title" href="{{root}}index.html">{{site_title}}</a>
  <button class="icon-button" id="theme-toggle-mobile" aria-label="Switch between light and dark mode">
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2.5v2M12 2.5v2M4.2 12h-2M21.8 12h-2M6.3 6.3 4.9 4.9M19.1 19.1l-1.4-1.4M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none"/></svg>
  </button>
</header>

<div class="scrim" id="scrim" hidden></div>

<div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-inner">
      <div class="brand">
        <a class="brand-title" href="{{root}}index.html">{{site_title}}</a>
        <p class="brand-tagline">{{tagline}}</p>
      </div>

      <nav class="nav" aria-label="Site">
          {{nav}}
      </nav>

      <div class="sidebar-foot">
        <div class="socials">
        {{socials}}
        </div>
        <button class="theme-toggle" id="theme-toggle" aria-label="Switch between light and dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2.5v2M12 2.5v2M4.2 12h-2M21.8 12h-2M6.3 6.3 4.9 4.9M19.1 19.1l-1.4-1.4M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none"/></svg>
          <span class="theme-label">Theme</span>
        </button>
      </div>
    </div>
  </aside>

  <main id="main">
    {{content}}
    <footer class="footer">
      <p>© {{year}} {{author}}</p>
    </footer>
  </main>

  {{toc}}

</div>

<script src="{{root}}assets/js/site.js?v={{v}}"></script>
</body>
</html>
